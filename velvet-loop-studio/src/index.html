<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velvet Loop Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar"><span class="brand">VELVET LOOP STUDIO</span><span class="sub">Rich Alucard · Sprite Preview</span></header>

  <main class="viewport">
    <canvas id="stage"></canvas>
    <div id="empty" class="empty">
      <div class="empty-title">No sprite sheet loaded</div>
      <div class="empty-hint">Click <b>Upload Sprite Sheet</b> and choose a sprite strip (PNG, WebP, JPG) or an animation (GIF, WebM, MP4).</div>
    </div>
  </main>

  <footer class="bar">
    <input id="file-input" type="file" accept="image/*,video/*,.png,.webp,.jpg,.jpeg,.gif,.apng,.mp4,.webm,.mov" hidden>
    <button id="upload" class="primary">Upload Sprite Sheet</button>

    <div class="group">
      <button id="play" disabled>Play</button>
      <button id="pause" disabled>Pause</button>
      <button id="restart" disabled>Restart</button>
    </div>

    <label class="fps">
      <span>FPS</span>
      <input id="fps" type="range" min="1" max="60" step="1">
      <output id="fps-value"></output>
    </label>

    <label class="toggle"><input id="loop" type="checkbox"><span>Loop</span></label>

    <div class="group style">
      <label class="toggle"><input id="richify" type="checkbox"><span>Rich Alucard-ify</span></label>
      <select id="level" title="Strength" disabled>
        <option value="whisper">Whisper</option>
        <option value="light">Light</option>
        <option value="medium" selected>Medium</option>
        <option value="full">Full</option>
      </select>
      <select id="colors" title="Palette size" disabled>
        <option value="">Auto colors</option>
        <option value="8">8 colors</option>
        <option value="12">12 colors</option>
        <option value="16">16 colors</option>
        <option value="24">24 colors</option>
        <option value="32">32 colors</option>
        <option value="48">48 colors</option>
        <option value="64">64 colors</option>
      </select>
      <button id="download" disabled title="Save the restyled result as a PNG (sprite strip if animated)">Download PNG</button>
    </div>

    <span id="status" class="status"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rave Stage — DEV Review</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="js/scenes/rave.css?v=__BUILD_ASSET_VERSION__">
<link rel="stylesheet" href="js/scenes/rave_review.css?v=__BUILD_ASSET_VERSION__">
</head>
<body>
<main>
  <div id="screen" aria-label="270 by 480 rave stage"></div>
  <section id="reviewControls" aria-label="DEV stage inspection">
    <h1>DEV / RAVE STAGE REVIEW</h1>
    <p>Stage only. No story or saved progress.</p>
    <button id="enterRave" type="button">ENTER RAVE STAGE REVIEW</button>
    <div id="inspection" hidden>
      <label><input type="checkbox" id="zones"> CONTACTS / SAFE ZONES</label>
      <label><input type="checkbox" id="dialogueProof"> DIALOGUE LAYOUT CHECK</label>
      <label><input type="checkbox" id="depthProbe"> SPEAKER DEPTH PROBE</label>
      <label>PARTY ADAPTER <select id="behavior"><option value="" disabled>UNEQUIPPED</option></select></label>
      <p id="adapterState" role="status">No authored situation loaded.</p>
      <button id="resetRave" type="button">RESET REVIEW</button><button id="exitRave" type="button">EXIT REVIEW</button>
    </div>
    <p id="reviewStatus" role="status"></p><small id="buildIdentity"></small>
  </section>
</main>
<script src="js/build-info.js?v=__BUILD_ASSET_VERSION__"></script>
<script src="js/engine/scenes.js?v=__BUILD_ASSET_VERSION__"></script>
<script src="js/data/stages.js?v=__BUILD_ASSET_VERSION__"></script>

<script src="js/data/party_behaviors.js?v=__BUILD_ASSET_VERSION__"></script>
<script src="js/systems/party.js?v=__BUILD_ASSET_VERSION__"></script>
<script src="js/systems/rave.js?v=__BUILD_ASSET_VERSION__"></script>
<script src="js/scenes/rave.js?v=__BUILD_ASSET_VERSION__"></script>
<script src="js/scenes/rave_review.js?v=__BUILD_ASSET_VERSION__"></script>
</body>
</html>

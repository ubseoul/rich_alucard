name: Test static release

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build -- --commit "$GITHUB_SHA"
      - run: npm run verify:artifact
